<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ved Robo</title>
  <link rel="icon" href="{{ url_for('static', filename='ved-logo.png') }}" type="image/png">
  <style>
    :root { color:#f8fbff; background:#060b13; font-family:Arial,sans-serif; } * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; overflow:hidden; background:radial-gradient(circle at 16% 18%,#48d9ff46 0,transparent 24rem),radial-gradient(circle at 86% 80%,#9a62ff40 0,transparent 31rem),radial-gradient(circle at 52% 44%,#17698770 0,transparent 35rem),linear-gradient(132deg,#050814 0%,#101d40 48%,#25114b 100%); }
    body::before { content:''; position:fixed; inset:-30%; pointer-events:none; background:conic-gradient(from 210deg at 52% 44%,transparent,#5bdeff16,transparent,#a772ff18,transparent); filter:blur(70px); animation:aurora 13s linear infinite; }
    .stage { position:relative; z-index:1; width:min(1280px,100vw); min-height:100vh; display:grid; grid-template-columns:minmax(330px,.9fr) minmax(360px,1.1fr); align-items:center; gap:clamp(20px,6vw,110px); padding:clamp(24px,6vw,88px); }
    .robot-button { width:min(560px,46vw); aspect-ratio:1/1.1; position:relative; display:grid; place-items:center; border:0; padding:0; cursor:pointer; background:transparent; color:inherit; -webkit-tap-highlight-color:transparent; }
    .robot-button:focus-visible { outline:3px solid #58dff7; outline-offset:12px; border-radius:42%; }
    .halo { position:absolute; width:86%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,#2ce3ff55 0 26%,#2ce3ff17 48%,transparent 70%); filter:blur(2px); animation:pulse 3s ease-in-out infinite; }
    .robot { position:relative; z-index:1; display:block; width:min(400px,78vw); height:auto; transform-origin:center bottom; animation:float 3.1s ease-in-out infinite; filter:drop-shadow(0 28px 28px #0008) drop-shadow(0 0 30px #4ee7ff4b); } .robot-image { display:block; }
    .base { position:absolute; bottom:1px; left:38px; width:194px; height:48px; border:5px solid #6b4d31; border-radius:50%; background:linear-gradient(#f2d29f,#c58e52); box-shadow:inset 0 9px 0 #ffe8bd70,0 17px 22px #0007; }
    .body { position:absolute; bottom:30px; left:61px; width:148px; height:164px; border:5px solid #6b4d31; border-radius:49% 49% 35% 35%; background:linear-gradient(110deg,#f5dbad,#d6a66f); }.chest { position:absolute; top:14px; left:30px; width:79px; height:73px; border:5px solid #563d2b; border-radius:38px 38px 28px 28px; background:#3ed9f3; clip-path:polygon(0 0,100% 0,79% 100%,50% 87%,21% 100%); box-shadow:inset 0 -8px #1590af55; }
    .head { position:absolute; top:4px; left:58px; width:154px; height:119px; border:5px solid #6b4d31; border-radius:47% 47% 40% 40%; background:linear-gradient(125deg,#f7dcae,#d9ab70); }.face { position:absolute; top:17px; left:18px; width:108px; height:76px; border:5px solid #5d4430; border-radius:37px; background:radial-gradient(circle at 50% 95%,#402f29,#1f2229 55%); box-shadow:inset 0 0 20px #0009; }.eye { position:absolute; top:20px; width:25px; height:25px; border-radius:50%; background:#45e1fa; box-shadow:0 0 16px #39dcf8; }.eye.left { left:20px; }.eye.right { right:20px; }.mouth { position:absolute; left:43px; bottom:10px; width:17px; height:5px; border-radius:5px; background:#45e1fa; transform-origin:center; }.ear { position:absolute; top:39px; width:15px; height:38px; border:3px solid #5d4430; border-radius:8px; background:#43dff6; }.ear.left { left:-17px; }.ear.right { right:-17px; }
    .arm { position:absolute; top:154px; width:43px; height:126px; border:5px solid #6b4d31; border-radius:25px; background:linear-gradient(90deg,#d39d60,#e6bb80); transform-origin:22px 9px; }.arm.left { left:32px; transform:rotate(12deg); }.arm.right { right:32px; transform:rotate(-12deg); }
    .robot.listening { animation:listening .75s ease-in-out infinite alternate; filter:drop-shadow(0 28px 28px #0008) drop-shadow(0 0 36px #ff866d88); }.robot.thinking { animation:thinking 1s ease-in-out infinite alternate; }.robot.speaking { animation:speaking .4s ease-in-out infinite alternate; filter:drop-shadow(0 28px 28px #0008) drop-shadow(0 0 40px #4ee7ff8a); }.robot.happy { filter:drop-shadow(0 28px 28px #0008) drop-shadow(0 0 42px #65f7d7a3); }.robot.curious { filter:drop-shadow(0 28px 28px #0008) drop-shadow(0 0 38px #c8a4ff8a); }
    .subtitle { width:100%; min-height:190px; display:grid; place-items:center; padding:clamp(26px,4vw,54px); border:1px solid #b5f5ff38; border-radius:32px; background:linear-gradient(135deg,#ffffff16,#a17bff16); box-shadow:0 25px 90px #0005,inset 0 1px #ffffff33; backdrop-filter:blur(16px); color:#f4fbff; text-align:left; font-size:clamp(22px,2.8vw,35px); font-weight:600; line-height:1.38; text-shadow:0 2px 20px #000; }
    video,canvas { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
    @keyframes float { 50% { transform:translateY(-10px) scale(1.025); } } @keyframes pulse { 50% { transform:scale(1.1); opacity:.65; } } @keyframes aurora { to { transform:rotate(360deg); } } @keyframes listening { to { transform:scale(1.035); } } @keyframes thinking { to { transform:rotate(7deg); } } @keyframes speaking { to { transform:translateY(-5px) rotate(1deg); } } @keyframes wave { to { transform:rotate(-46deg); } } @keyframes mouth { to { transform:scaleX(1.7) scaleY(.4); } } @keyframes blink { 48%,52% { transform:scaleY(.15); } }
    @media (max-width:760px) { body { overflow:auto; } .stage { grid-template-columns:1fr; grid-template-rows:auto auto; gap:12px; padding:30px 20px; } .robot-button { width:min(440px,90vw); } .robot { transform:scale(1.04); } .subtitle { min-height:120px; text-align:center; font-size:clamp(18px,5vw,25px); } } @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; } }
  </style>
</head>
<body>
  <main class="stage">
    <button id="robotButton" class="robot-button" type="button" aria-label="Start talking with Ved Robo">
      <span class="halo" aria-hidden="true"></span>
      <img id="robot" class="robot robot-image" src="{{ url_for('static', filename='ved-robo.png') }}" alt="Ved Robo" draggable="false">
    </button>
    <p id="subtitle" class="subtitle" role="status" aria-live="polite">Tap Ved to begin. Camera recognition stays only in this browser.</p>
  </main>
  <video id="camera" autoplay muted playsinline></video><canvas id="snapshot"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script>
    const robot=document.querySelector('#robot'), robotButton=document.querySelector('#robotButton'), subtitle=document.querySelector('#subtitle'), camera=document.querySelector('#camera'), snapshot=document.querySelector('#snapshot');
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition, profileKey='ved_robo_face_profiles_v1';
    let recognition, listening=false, started=false, faceModelsReady=false, enrollment=null, latestFace=null, history=[], activeProfileId='', sessionReady=false, faceMissingSince=0, presencePrompted=false, detecting=false, speaking=false, processingSpeech=false, silenceCount=0, restartTimer=0, objectModel=null, currentAudio=null, currentAudioDone=null, audioContext=null, microphoneStream=null, interruptionTimer=0, interruptionStarted=0, interrupting=false;
    const profiles=JSON.parse(localStorage.getItem(profileKey)||'[]');
    function setState(next,text){robot.className='robot '+next;subtitle.textContent=text;}
    function cleanSpeechText(text){return String(text||'').replace(/\*\*|__|`|#+/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/[•]/g,'. ').replace(/\s+/g,' ').trim();}
    function expression(text){const value=String(text).toLowerCase();if(/[?]/.test(value))return'curious';if(/welcome|glad|happy|great|wonderful|good to see/.test(value))return'happy';return'';}
    function clearRestart(){if(restartTimer){window.clearTimeout(restartTimer);restartTimer=0;}}
    function resumeListening(delay=300){if(!started||!recognition||speaking||processingSpeech||listening)return;clearRestart();restartTimer=window.setTimeout(()=>{restartTimer=0;if(!speaking&&!processingSpeech&&!listening){try{recognition.start();}catch{setState('curious','Tap Ved, then speak your answer.');}}},delay);}
    function pauseListening(){clearRestart();if(listening&&recognition){try{recognition.abort();}catch{}}}
    function listeningPrompt(){if(enrollment==='name')return 'Please tell me your name.';return 'Listening for your question.';}
    function finishSpeaking(){if(interrupting)return;speaking=false;currentAudio=null;setState('',listeningPrompt());resumeListening();}
    function speechLocaleFor(text){const value=String(text||'');if(/[\u0900-\u097f]/u.test(value))return'hi-IN';if(/[\u0980-\u09ff]/u.test(value))return'bn-IN';if(/[\u0a80-\u0aff]/u.test(value))return'gu-IN';if(/[\u0a00-\u0a7f]/u.test(value))return'pa-IN';if(/[\u0b80-\u0bff]/u.test(value))return'ta-IN';if(/[\u0c00-\u0c7f]/u.test(value))return'te-IN';if(/[\u0c80-\u0cff]/u.test(value))return'kn-IN';if(/[\u0d00-\u0d7f]/u.test(value))return'ml-IN';if(/[\u0600-\u06ff]/u.test(value))return'ur-PK';if(/[\u4e00-\u9fff]/u.test(value))return'zh-CN';if(/[\u3040-\u30ff]/u.test(value))return'ja-JP';if(/[\uac00-\ud7af]/u.test(value))return'ko-KR';if(/[\u0400-\u04ff]/u.test(value))return'ru-RU';return navigator.language||'en-US';}
    function browserSpeak(text){return new Promise(resolve=>{if(!window.speechSynthesis){finishSpeaking();resolve();return;}const speech=new SpeechSynthesisUtterance(cleanSpeechText(text));speech.lang=speechLocaleFor(text);speech.rate=1.12;let settled=false;const done=()=>{if(settled)return;settled=true;finishSpeaking();resolve();};speech.onstart=()=>setState('speaking '+expression(text),text);speech.onend=done;speech.onerror=done;window.speechSynthesis.cancel();window.speechSynthesis.speak(speech);});}
    async function speak(text){const clean=cleanSpeechText(text);speaking=true;pauseListening();setState('speaking '+expression(clean),clean);try{const response=await fetch('/api/robo-speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:clean,language:speechLocaleFor(clean)})});if(!response.ok)throw new Error();const url=URL.createObjectURL(await response.blob()),audio=new Audio(url);currentAudio=audio;audio.playbackRate=1.12;await new Promise(resolve=>{let settled=false;const finish=()=>{if(settled)return;settled=true;currentAudioDone=null;URL.revokeObjectURL(url);finishSpeaking();resolve();};const fallback=()=>{if(settled)return;settled=true;currentAudioDone=null;URL.revokeObjectURL(url);currentAudio=null;browserSpeak(clean).then(resolve);};currentAudioDone=finish;audio.onplay=()=>setState('speaking '+expression(clean),clean);audio.onended=finish;audio.onerror=fallback;audio.play().catch(fallback);});}catch{await browserSpeak(clean);}}
    async function handleInterruption(){if(interrupting||!speaking)return;interrupting=true;clearRestart();if(currentAudio){currentAudio.pause();currentAudio=null;}if(currentAudioDone)currentAudioDone();if(window.speechSynthesis)window.speechSynthesis.cancel();speaking=false;setState('curious','Do you want to add something more to the question?');await new Promise(resolve=>setTimeout(resolve,120));interrupting=false;await speak('Do you want to add something more to the question?');}
    function setupInterruptionMonitor(){if(!microphoneStream||!window.AudioContext)return;try{audioContext=new AudioContext();const source=audioContext.createMediaStreamSource(microphoneStream),analyser=audioContext.createAnalyser(),samples=new Uint8Array(512);analyser.fftSize=1024;source.connect(analyser);window.setInterval(()=>{if(!speaking||interrupting){interruptionStarted=0;return;}analyser.getByteTimeDomainData(samples);let energy=0;for(const sample of samples){const value=(sample-128)/128;energy+=value*value;}const level=Math.sqrt(energy/samples.length);if(level>.055){interruptionStarted||=Date.now();if(Date.now()-interruptionStarted>650)handleInterruption();}else interruptionStarted=0;},150);}catch{ /* interruption detection is optional */ }}
    function distance(a,b){return Math.sqrt(a.reduce((sum,value,index)=>sum+(value-b[index])**2,0));}
    function captureImage(){const size=220;snapshot.width=size;snapshot.height=size;const ctx=snapshot.getContext('2d');const side=Math.min(camera.videoWidth,camera.videoHeight);ctx.drawImage(camera,(camera.videoWidth-side)/2,(camera.videoHeight-side)/2,side,side,0,0,size,size);return snapshot.toDataURL('image/jpeg',.72);}
    async function detectFace(){if(detecting||!faceModelsReady||camera.readyState<2||speaking||processingSpeech)return;detecting=true;try{const result=await faceapi.detectSingleFace(camera,new faceapi.TinyFaceDetectorOptions({inputSize:160,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();if(!result){if(sessionReady&&!enrollment){faceMissingSince||=Date.now();if(!presencePrompted&&Date.now()-faceMissingSince>30000){presencePrompted=true;await speak('Is someone there? I cannot see a familiar face.');}}return;}latestFace={descriptor:Array.from(result.descriptor),image:captureImage()};faceMissingSince=0;presencePrompted=false;if(sessionReady)return;const match=profiles.map(profile=>({profile,score:distance(latestFace.descriptor,profile.descriptor)})).sort((a,b)=>a.score-b.score)[0];sessionReady=true;if(match&&match.score<.48){activeProfileId=match.profile.id;await speak(`Welcome back, ${match.profile.name}. What would you like to ask?`);return;}enrollment='name';await speak('I have not met you before. Your profile will stay only in this browser. Please tell me your name by saying: my name is.');}catch{ /* camera continues without recognition */ }finally{detecting=false;}}
    function saveProfile(name){if(!latestFace)return false;const profile={id:crypto.randomUUID(),name,descriptor:latestFace.descriptor,image:latestFace.image,createdAt:new Date().toISOString()};profiles.push(profile);localStorage.setItem(profileKey,JSON.stringify(profiles));activeProfileId=profile.id;sessionReady=true;return true;}
    function nameFrom(text){const value=String(text).trim();const match=value.match(/(?:my name is|i am|i'm|this is|मेरा नाम(?: है)?|मैं हूँ)\s+([\p{L}][\p{L}\s'-]{0,38})/iu);return (match?match[1]:value).trim().replace(/(?:\s+है|[.?!,]+)$/u,'').trim();}
    function asksAboutVisibleObject(question){return /(?:what(?:'s| is)? this|what am i holding|what.{0,50}(?:object|thing|item|holding|hold|hand|camera|see)|identify.{0,50}(?:object|thing|item|hand|camera)|can you see.{0,50}(?:object|thing|item|hand|camera))/i.test(String(question||''));}
    async function describeVisibleObject(){if(camera.readyState<2){await speak('I cannot see the camera yet. Please wait a moment and try again.');return;}setState('thinking','Looking closely at the object in your hand...');try{if(!window.cocoSsd)throw new Error('Object recognition could not load.');if(!objectModel)objectModel=await cocoSsd.load({base:'lite_mobilenet_v2'});const samples=[];for(let index=0;index<3;index+=1){samples.push(...await objectModel.detect(camera));if(index<2)await new Promise(resolve=>setTimeout(resolve,250));}const scores=new Map();samples.filter(item=>item.class!=='person'&&item.score>=.35).forEach(item=>scores.set(item.class,(scores.get(item.class)||0)+item.score));const visible=[...scores.entries()].sort((a,b)=>b[1]-a[1])[0];if(!visible){await speak('I cannot identify a clear object yet. Hold it close to the camera in good lighting and try again.');return;}await speak(`I can see what looks like a ${visible[0]}.`);}catch(error){await speak(error.message||'I could not identify the object right now. Please try again.');}}
    async function answerQuestion(question){if(asksAboutVisibleObject(question)){await describeVisibleObject();return;}setState('thinking','Ved is thinking...');try{history.push({role:'user',content:question});const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:question,history:history.slice(-10),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Ved could not answer right now.');history.push({role:'assistant',content:data.reply});await speak(data.reply);}catch(error){await speak(error.message||'I could not answer that right now.');}}
    async function handleSpeech(text){const spoken=String(text||'').trim();if(!spoken)return;if(enrollment==='consent'){const agrees=/\b(yes|yeah|yep|i agree|agree|okay|ok|sure|haan|ha)\b/i.test(spoken)||/(हाँ|हां|जी हाँ|जी हां|हाँ जी|हां जी)/u.test(spoken);const refuses=/\b(no|nope|nah|do not|don't|decline)\b/i.test(spoken)||/(नहीं|नही|ना|मत)/u.test(spoken);if(agrees){enrollment='name';await speak('Thank you. Please tell me your name by saying: my name is.');}else if(refuses){declinedUntil=Date.now()+60000;enrollment=null;await speak('No profile will be saved. You can still ask me questions.');}else await speak('I need a clear yes or no before saving a profile. Please say yes to continue, or no to skip it.');return;}if(enrollment==='name'){const name=nameFrom(spoken);if(saveProfile(name)){enrollment=null;await speak(`Nice to meet you, ${name}. I saved your face profile only in this browser. What would you like to ask?`);}else await speak('Please look at the camera for a moment, then tell me your name again.');return;}await answerQuestion(spoken);}
    async function typedFallback(){const promptText=enrollment==='name'?'I could not hear your name. Type your name, then press OK.':'I could not hear you. Type your question, then press OK.';const typed=window.prompt(promptText);if(!typed||!typed.trim()){setState('curious',listeningPrompt());resumeListening();return;}silenceCount=0;processingSpeech=true;try{await handleSpeech(typed.trim());}finally{processingSpeech=false;resumeListening();}}
    function setupRecognition(){if(!SpeechRecognition){setState('curious','Browser voice input is unavailable. Tap Ved to type your answer.');return;}recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;recognition.lang=navigator.language||'en-US';recognition.onstart=()=>{listening=true;if(!speaking)setState('listening',listeningPrompt());};recognition.onresult=async event=>{listening=false;silenceCount=0;processingSpeech=true;try{await handleSpeech(event.results[0][0].transcript);}finally{processingSpeech=false;resumeListening();}};recognition.onend=()=>{listening=false;if(!speaking&&!processingSpeech&&silenceCount<2)resumeListening();};recognition.onerror=event=>{listening=false;if(event.error==='aborted')return;if(event.error==='no-speech'){silenceCount+=1;if(silenceCount>=2){setState('curious','I could not hear you. Tap Ved once to type your answer.');return;}if(!speaking)setState('listening',listeningPrompt());resumeListening();return;}if(event.error==='not-allowed'||event.error==='service-not-allowed'){setState('curious','Microphone permission is blocked. Allow microphone access, then tap Ved.');return;}setState('curious','Browser voice input had a problem. Tap Ved to type your answer.');};}
    async function start(){if(started)return;started=true;setState('thinking','Starting camera and voice...');try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:640}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});camera.srcObject=stream;microphoneStream=new MediaStream(stream.getAudioTracks());await camera.play();setupInterruptionMonitor();try{await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),faceapi.nets.faceLandmark68Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),faceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models')]);}catch{throw new Error('models');}faceModelsReady=true;setupRecognition();resumeListening();setState('',profiles.length?'Camera is ready. Looking for a familiar face...':'Camera is ready. Look at Ved so I can meet you.');await detectFace();window.setInterval(detectFace,900);}catch(error){setState('',error.message==='models'?'Face recognition could not load. Check your internet connection and tap Ved to retry.':'Camera and microphone permission are needed. Tap Ved and allow both.');started=false;}}
    robotButton.addEventListener('click',async()=>{if(!started){await start();return;}if(speaking)return;if(silenceCount>=2||!SpeechRecognition){await typedFallback();return;}silenceCount=0;if(enrollment==='name'){await speak('Please tell me your name by saying: my name is.');return;}setState('listening','Listening for your question.');resumeListening(0);});
  </script>
</body>
</html>
