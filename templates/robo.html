<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ved Robo</title>
  <link rel="icon" href="{{ url_for('static', filename='ved-logo.png') }}" type="image/png">
  <style>
    :root { color:#f8fbff; background:#060b13; font-family:Arial,sans-serif; } * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; overflow:hidden; display:grid; place-items:center; background:radial-gradient(circle at 50% 45%,#153f4d 0,transparent 29rem),linear-gradient(135deg,#050912,#13122a); }
    .stage { width:min(750px,100vw); min-height:100vh; display:grid; grid-template-rows:1fr auto; place-items:center; padding:clamp(18px,4vw,48px); }
    .robot-button { width:min(390px,78vw); aspect-ratio:1/1.1; position:relative; display:grid; place-items:center; border:0; padding:0; cursor:pointer; background:transparent; color:inherit; -webkit-tap-highlight-color:transparent; }
    .robot-button:focus-visible { outline:3px solid #58dff7; outline-offset:12px; border-radius:42%; }
    .halo { position:absolute; width:86%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,#2ce3ff55 0 26%,#2ce3ff17 48%,transparent 70%); filter:blur(2px); animation:pulse 3s ease-in-out infinite; }
    .robot { position:relative; z-index:1; width:270px; height:350px; transform-origin:center bottom; animation:float 3.1s ease-in-out infinite; }
    .base { position:absolute; bottom:1px; left:38px; width:194px; height:48px; border:5px solid #6b4d31; border-radius:50%; background:linear-gradient(#f2d29f,#c58e52); box-shadow:inset 0 9px 0 #ffe8bd70,0 17px 22px #0007; }
    .body { position:absolute; bottom:30px; left:61px; width:148px; height:164px; border:5px solid #6b4d31; border-radius:49% 49% 35% 35%; background:linear-gradient(110deg,#f5dbad,#d6a66f); }.chest { position:absolute; top:14px; left:30px; width:79px; height:73px; border:5px solid #563d2b; border-radius:38px 38px 28px 28px; background:#3ed9f3; clip-path:polygon(0 0,100% 0,79% 100%,50% 87%,21% 100%); box-shadow:inset 0 -8px #1590af55; }
    .head { position:absolute; top:4px; left:58px; width:154px; height:119px; border:5px solid #6b4d31; border-radius:47% 47% 40% 40%; background:linear-gradient(125deg,#f7dcae,#d9ab70); }.face { position:absolute; top:17px; left:18px; width:108px; height:76px; border:5px solid #5d4430; border-radius:37px; background:radial-gradient(circle at 50% 95%,#402f29,#1f2229 55%); box-shadow:inset 0 0 20px #0009; }.eye { position:absolute; top:20px; width:25px; height:25px; border-radius:50%; background:#45e1fa; box-shadow:0 0 16px #39dcf8; }.eye.left { left:20px; }.eye.right { right:20px; }.mouth { position:absolute; left:43px; bottom:10px; width:17px; height:5px; border-radius:5px; background:#45e1fa; transform-origin:center; }.ear { position:absolute; top:39px; width:15px; height:38px; border:3px solid #5d4430; border-radius:8px; background:#43dff6; }.ear.left { left:-17px; }.ear.right { right:-17px; }
    .arm { position:absolute; top:154px; width:43px; height:126px; border:5px solid #6b4d31; border-radius:25px; background:linear-gradient(90deg,#d39d60,#e6bb80); transform-origin:22px 9px; }.arm.left { left:32px; transform:rotate(12deg); }.arm.right { right:32px; transform:rotate(-12deg); }
    .robot.listening { animation:listening .75s ease-in-out infinite alternate; }.robot.listening .eye { background:#ff866d; box-shadow:0 0 18px #ff715a; }.robot.thinking .head { animation:thinking 1s ease-in-out infinite alternate; }.robot.thinking .eye { animation:blink 1.1s steps(1) infinite; }.robot.speaking { animation:speaking .4s ease-in-out infinite alternate; }.robot.speaking .arm.right { animation:wave .55s ease-in-out infinite alternate; }.robot.speaking .mouth { height:17px; animation:mouth .17s ease-in-out infinite alternate; }.robot.happy .mouth { width:22px; height:9px; border-radius:0 0 15px 15px; }.robot.curious .eye.left { transform:translateY(-4px); }
    .subtitle { width:min(760px,94vw); min-height:70px; display:grid; place-items:center; padding:14px 20px 28px; color:#ecfaff; text-align:center; font-size:clamp(17px,2.4vw,23px); line-height:1.45; text-shadow:0 2px 15px #000; }
    video,canvas { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
    @keyframes float { 50% { transform:translateY(-8px); } } @keyframes pulse { 50% { transform:scale(1.1); opacity:.65; } } @keyframes listening { to { transform:scale(1.035); } } @keyframes thinking { to { transform:rotate(7deg); } } @keyframes speaking { to { transform:translateY(-5px) rotate(1deg); } } @keyframes wave { to { transform:rotate(-46deg); } } @keyframes mouth { to { transform:scaleX(1.7) scaleY(.4); } } @keyframes blink { 48%,52% { transform:scaleY(.15); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; } }
  </style>
</head>
<body>
  <main class="stage">
    <button id="robotButton" class="robot-button" type="button" aria-label="Start talking with Ved Robo">
      <span class="halo" aria-hidden="true"></span>
      <span id="robot" class="robot" aria-hidden="true"><span class="head"><span class="ear left"></span><span class="ear right"></span><span class="face"><span class="eye left"></span><span class="eye right"></span><span class="mouth"></span></span></span><span class="body"><span class="chest"></span></span><span class="arm left"></span><span class="arm right"></span><span class="base"></span></span>
    </button>
    <p id="subtitle" class="subtitle" role="status" aria-live="polite">Tap Ved to begin. Camera recognition stays only in this browser.</p>
  </main>
  <video id="camera" autoplay muted playsinline></video><canvas id="snapshot"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script>
    const robot=document.querySelector('#robot'), robotButton=document.querySelector('#robotButton'), subtitle=document.querySelector('#subtitle'), camera=document.querySelector('#camera'), snapshot=document.querySelector('#snapshot');
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition, profileKey='ved_robo_face_profiles_v1';
    let recognition, listening=false, started=false, faceModelsReady=false, enrollment=null, latestFace=null, history=[], lastGreeting='', detecting=false, speaking=false, processingSpeech=false, declinedUntil=0;
    const profiles=JSON.parse(localStorage.getItem(profileKey)||'[]');
    function setState(next,text){robot.className='robot '+next;subtitle.textContent=text;}
    function cleanSpeechText(text){return String(text||'').replace(/\*\*|__|`|#+/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/[•]/g,'. ').replace(/\s+/g,' ').trim();}
    function expression(text){const value=String(text).toLowerCase();if(/[?]/.test(value))return'curious';if(/welcome|glad|happy|great|wonderful|good to see/.test(value))return'happy';return'';}
    function resumeListening(){if(!started||!recognition||speaking||processingSpeech||listening)return;window.setTimeout(()=>{if(!speaking&&!processingSpeech&&!listening){try{recognition.start();}catch{}}},300);}
    function pauseListening(){if(listening&&recognition){try{recognition.abort();}catch{}}}
    function finishSpeaking(){speaking=false;setState('', 'Listening for your question.');resumeListening();}
    function browserSpeak(text){if(!window.speechSynthesis){finishSpeaking();return;}const speech=new SpeechSynthesisUtterance(cleanSpeechText(text));speech.lang=navigator.language||'en-US';speech.rate=1.12;speech.onstart=()=>setState('speaking '+expression(text),text);speech.onend=finishSpeaking;speech.onerror=finishSpeaking;window.speechSynthesis.cancel();window.speechSynthesis.speak(speech);}
    async function speak(text){const clean=cleanSpeechText(text);speaking=true;pauseListening();setState('speaking '+expression(clean),clean);try{const response=await fetch('/api/robo-speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:clean,language:navigator.language||'en-US'})});if(!response.ok)throw new Error();const url=URL.createObjectURL(await response.blob()),audio=new Audio(url);audio.playbackRate=1.12;audio.onplay=()=>setState('speaking '+expression(clean),clean);audio.onended=()=>{URL.revokeObjectURL(url);finishSpeaking();};audio.onerror=()=>{URL.revokeObjectURL(url);browserSpeak(clean);};await audio.play();}catch{browserSpeak(clean);}}
    function distance(a,b){return Math.sqrt(a.reduce((sum,value,index)=>sum+(value-b[index])**2,0));}
    function captureImage(){const size=220;snapshot.width=size;snapshot.height=size;const ctx=snapshot.getContext('2d');const side=Math.min(camera.videoWidth,camera.videoHeight);ctx.drawImage(camera,(camera.videoWidth-side)/2,(camera.videoHeight-side)/2,side,side,0,0,size,size);return snapshot.toDataURL('image/jpeg',.72);}
    async function detectFace(){if(detecting||!faceModelsReady||camera.readyState<2)return;detecting=true;try{const result=await faceapi.detectSingleFace(camera,new faceapi.TinyFaceDetectorOptions({inputSize:160,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();if(!result)return;latestFace={descriptor:Array.from(result.descriptor),image:captureImage()};if(enrollment||Date.now()<declinedUntil)return;const match=profiles.map(profile=>({profile,score:distance(latestFace.descriptor,profile.descriptor)})).sort((a,b)=>a.score-b.score)[0];if(match&&match.score<.48){if(lastGreeting!==match.profile.id){lastGreeting=match.profile.id;speak(`Welcome back, ${match.profile.name}. What would you like to ask?`);}return;}enrollment='consent';speak('I have not met you before. May I save your name and face profile only in this browser? Please say yes or no.');}catch{ /* camera continues without recognition */ }finally{detecting=false;}}
    function saveProfile(name){if(!latestFace)return false;const profile={id:crypto.randomUUID(),name,descriptor:latestFace.descriptor,image:latestFace.image,createdAt:new Date().toISOString()};profiles.push(profile);localStorage.setItem(profileKey,JSON.stringify(profiles));lastGreeting=profile.id;return true;}
    function nameFrom(text){const value=String(text).trim();const match=value.match(/(?:my name is|i am|i'm|this is|मेरा नाम(?: है)?|मैं हूँ)\s+([\p{L}][\p{L}\s'-]{0,38})/iu);return (match?match[1]:value).trim().replace(/(?:\s+है|[.?!,]+)$/u,'').trim();}
    async function answerQuestion(question){setState('thinking','Ved is thinking...');try{history.push({role:'user',content:question});const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:question,history:history.slice(-10),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Ved could not answer right now.');history.push({role:'assistant',content:data.reply});speak(data.reply);}catch(error){speak(error.message||'I could not answer that right now.');}}
    async function handleSpeech(text){const spoken=String(text||'').trim();if(!spoken)return;if(enrollment==='consent'){if(/\b(yes|i agree|agree|okay|ok|haan|ha)\b/i.test(spoken)||/(हाँ|हां|जी हाँ|जी हां|हाँ जी|हां जी)/u.test(spoken)){enrollment='name';speak('Thank you. Please tell me your name by saying: my name is.');}else{declinedUntil=Date.now()+60000;enrollment=null;speak('No profile will be saved. You can still ask me questions.');}return;}if(enrollment==='name'){const name=nameFrom(spoken);if(saveProfile(name)){enrollment=null;speak(`Nice to meet you, ${name}. I saved your face profile only in this browser. What would you like to ask?`);}else speak('Please look at the camera for a moment, then tell me your name again.');return;}answerQuestion(spoken);}
    function setupRecognition(){if(!SpeechRecognition){setState('', 'Voice input is not supported in this browser.');return;}recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=false;recognition.lang=navigator.language||'en-US';recognition.onstart=()=>{listening=true;if(!speaking)setState('listening','Listening...');};recognition.onresult=async event=>{processingSpeech=true;await handleSpeech(event.results[0][0].transcript);processingSpeech=false;resumeListening();};recognition.onend=()=>{listening=false;resumeListening();};recognition.onerror=event=>{listening=false;if(event.error==='aborted'||event.error==='no-speech'){resumeListening();return;}setState('', 'I could not hear that. Tap Ved and try again.');};}
    async function start(){if(started)return;started=true;setState('thinking','Starting camera and voice...');try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:640}},audio:false});camera.srcObject=stream;await camera.play();try{await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),faceapi.nets.faceLandmark68Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),faceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models')]);}catch{throw new Error('models');}faceModelsReady=true;setupRecognition();resumeListening();setState('',profiles.length?'Camera is ready. Looking for a familiar face...':'Camera is ready. Look at Ved so I can meet you.');await detectFace();window.setInterval(detectFace,900);}catch(error){setState('',error.message==='models'?'Face recognition could not load. Check your internet connection and tap Ved to retry.':'Camera permission is needed. Tap Ved and allow camera access.');started=false;}}
    robotButton.addEventListener('click',start);
  </script>
</body>
</html>
