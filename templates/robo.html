<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ved Robo</title>
  <link rel="icon" href="{{ url_for('static', filename='ved-logo.png') }}" type="image/png">
  <style>
    :root { font-family: Arial, sans-serif; color: #25283a; background: #f8f7f2; } * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 50% 42%, #e3fbff, transparent 23rem), linear-gradient(135deg, #fbfaf5, #eeecff); }
    header { height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(18px,5vw,64px); border-bottom: 1px solid rgba(83,74,61,.12); background: rgba(255,255,255,.65); backdrop-filter: blur(12px); }
    .brand, .back { color: #302b42; font-weight: 800; text-decoration: none; } .brand { display: flex; align-items: center; gap: 10px; } .brand img { width: 34px; height: 34px; } .back { font-size: 14px; color: #6f687e; }
    main { width: min(880px, calc(100% - 32px)); min-height: calc(100vh - 76px); margin: auto; display: grid; place-items: center; padding: 28px 0; }
    .stage { width: 100%; display: grid; grid-template-columns: minmax(260px, 1fr) minmax(290px, 370px); align-items: center; gap: clamp(24px,7vw,80px); }
    .copy h1 { margin: 0 0 12px; font-size: clamp(40px,7vw,70px); letter-spacing: -.06em; } .copy p { max-width: 390px; margin: 0; color: #6f6a63; font-size: 17px; line-height: 1.55; }
    .status { display: inline-flex; align-items: center; gap: 8px; margin-top: 25px; padding: 9px 13px; border-radius: 999px; background: #fff; color: #665e73; font-size: 14px; box-shadow: 0 8px 22px rgba(58,47,77,.08); } .status b { width: 9px; height: 9px; border-radius: 50%; background: #48cfa1; }
    .robo-scene { position: relative; height: 410px; display: grid; place-items: center; overflow: hidden; border: 1px solid rgba(100,87,71,.13); border-radius: 36px; background: rgba(255,255,255,.7); box-shadow: 0 24px 60px rgba(61,53,77,.14); }
    .robo-scene::before { content:""; position:absolute; width:280px; height:280px; border-radius:50%; background:#ddf8ff; filter:blur(2px); }
    .robot { position: relative; z-index: 1; width: 260px; height: 330px; transform-origin: center bottom; animation: idle 3.2s ease-in-out infinite; }
    .base { position:absolute; left:33px; bottom:0; width:194px; height:47px; border:4px solid #5a4632; border-radius:50%; background:linear-gradient(#eccd9d,#cfa670); box-shadow: inset 0 10px 0 rgba(255,255,255,.35), 0 11px 18px rgba(70,51,31,.2); }
    .body { position:absolute; left:58px; bottom:31px; width:144px; height:160px; border:4px solid #5a4632; border-radius:48% 48% 34% 34%; background:#e9cb9c; } .chest { position:absolute; top:12px; left:31px; width:75px; height:72px; border:4px solid #554330; border-radius:35px 35px 28px 28px; background:#49d9f2; clip-path: polygon(0 0,100% 0,80% 100%,50% 88%,20% 100%); }
    .head { position:absolute; left:61px; top:8px; width:138px; height:112px; border:4px solid #5a4632; border-radius:47% 47% 39% 39%; background:#e9cb9c; } .face { position:absolute; left:15px; top:17px; width:100px; height:72px; border:4px solid #5a4632; border-radius:34px; background:#3b3330; } .eye { position:absolute; top:24px; width:24px; height:24px; border-radius:50%; background:#41d8f2; box-shadow:0 0 15px rgba(65,216,242,.8); } .eye:first-child { left:20px; } .eye:last-child { right:20px; }
    .ear { position:absolute; top:35px; width:13px; height:34px; border-radius:7px; background:#42d8ef; border:3px solid #584332; } .ear.left { left:-14px; } .ear.right { right:-14px; }
    .arm { position:absolute; top:151px; width:41px; height:122px; border:4px solid #5a4632; border-radius:23px; background:#d7ad76; transform-origin:20px 8px; } .arm.left { left:32px; transform:rotate(12deg); } .arm.right { right:32px; transform:rotate(-12deg); }
    .robot.listening { animation: listen .75s ease-in-out infinite alternate; } .robot.listening .eye { background:#ff755d; box-shadow:0 0 16px rgba(255,117,93,.8); } .robot.thinking .head { animation: think 1s ease-in-out infinite alternate; } .robot.thinking .eye { animation: blink 1.2s steps(1) infinite; } .robot.speaking { animation: talk .38s ease-in-out infinite alternate; } .robot.speaking .arm.right { animation: wave .55s ease-in-out infinite alternate; } .robot.speaking .eye { animation: glow .55s ease-in-out infinite alternate; }
    @keyframes idle { 50% { transform:translateY(-7px); } } @keyframes listen { to { transform:scale(1.03); } } @keyframes think { to { transform:rotate(7deg); } } @keyframes talk { to { transform:translateY(-5px) rotate(1deg); } } @keyframes wave { to { transform:rotate(-44deg); } } @keyframes glow { to { transform:scale(1.16); } } @keyframes blink { 48%,52% { transform:scaleY(.15); } }
    form { width:min(640px,100%); display:grid; grid-template-columns:1fr auto; gap:10px; margin-top:30px; padding:10px; border:1px solid #d7d0c4; border-radius:22px; background:#fff; box-shadow:0 14px 32px rgba(55,45,35,.09); } input { min-width:0; border:0; outline:0; padding:0 10px; color:#25283a; font:inherit; } button { min-height:48px; border:0; border-radius:15px; padding:0 18px; background:#6550ad; color:#fff; font:inherit; font-weight:800; cursor:pointer; } button:hover { background:#503e91; } button.listening { background:#df654f; } .reply { min-height:24px; margin:15px 0 0; color:#5e5864; text-align:center; line-height:1.5; } .hint { margin-top:8px; color:#8a8379; font-size:13px; text-align:center; }
    @media(max-width:700px){ .stage{grid-template-columns:1fr; text-align:center}.copy p{margin:auto}.robo-scene{height:350px; order:-1}.robot{transform:scale(.88)} }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <header><a class="brand" href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='ved-logo.png') }}" alt="">Ved Robo</a><a class="back" href="{{ url_for('ved_home') }}">Open chatbot →</a></header>
  <main><div><section class="stage"><div class="copy"><h1>Hi, I’m Ved.</h1><p>Press the microphone and talk naturally. I’ll listen, think about your request, and reply aloud with expressive gestures.</p><div class="status"><b></b><span id="statusText">Ready for your voice command</span></div></div><div class="robo-scene"><div id="robot" class="robot" aria-label="Animated Ved robot"><div class="head"><div class="ear left"></div><div class="ear right"></div><div class="face"><span class="eye"></span><span class="eye"></span></div></div><div class="body"><div class="chest"></div></div><div class="arm left"></div><div class="arm right"></div><div class="base"></div></div></div></section><form id="roboForm"><input id="command" autocomplete="off" placeholder="Type a message, or use the microphone…" aria-label="Message Ved Robo"><button id="mic" type="button" aria-label="Talk to Ved Robo">🎙 Talk</button></form><p id="reply" class="reply" aria-live="polite"></p><p class="hint">Voice input works in Chrome and other supported browsers. Microphone access is required.</p></div></main>
  <script>
    const robot=document.querySelector('#robot'), form=document.querySelector('#roboForm'), command=document.querySelector('#command'), mic=document.querySelector('#mic'), reply=document.querySelector('#reply'), statusText=document.querySelector('#statusText');
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition; let recognition, listening=false;
    function state(next,label){ robot.className='robot '+next; statusText.textContent=label; }
    function speak(text){ if(!window.speechSynthesis){state('', 'Voice output is not supported in this browser.');return;} const speech=new SpeechSynthesisUtterance(text); speech.lang=navigator.language||'en-US'; speech.rate=1; speech.addEventListener('start',()=>state('speaking','Ved is speaking')); speech.addEventListener('end',()=>state('', 'Ready for your voice command')); speech.addEventListener('error',()=>state('', 'Ready for your voice command')); window.speechSynthesis.cancel();window.speechSynthesis.speak(speech); }
    async function ask(text){ const message=text.trim(); if(!message)return; command.value=''; reply.textContent='Ved is thinking…'; state('thinking','Ved is thinking'); try{const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history:[],timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Ved could not reply right now.');reply.textContent=data.reply;speak(data.reply);}catch(error){reply.textContent=error.message;state('', 'Ready for your voice command');} }
    form.addEventListener('submit',event=>{event.preventDefault();ask(command.value)});
    if(!SpeechRecognition){mic.disabled=true;mic.title='Voice input is not supported in this browser.';statusText.textContent='Use typed messages in this browser.';} else {recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=true;recognition.lang=navigator.language||'en-US';recognition.onstart=()=>{listening=true;mic.classList.add('listening');mic.textContent='■ Stop';state('listening','Listening…');};recognition.onresult=event=>{let text='';for(const result of event.results)text+=result[0].transcript;command.value=text;};recognition.onend=()=>{listening=false;mic.classList.remove('listening');mic.textContent='🎙 Talk';if(command.value.trim())ask(command.value);else state('', 'Ready for your voice command');};recognition.onerror=()=>{listening=false;mic.classList.remove('listening');mic.textContent='🎙 Talk';state('', 'Microphone permission was not granted.');};mic.addEventListener('click',()=>{if(listening){recognition.stop();return;}window.speechSynthesis?.cancel();recognition.start();});}
  </script>
</body>
</html>
