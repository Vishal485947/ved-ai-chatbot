  <style>

    .head { position:absolute; top:4px; left:58px; width:154px; height:119px; border:5px solid #6b4d31; border-radius:47% 47% 40% 40%; background:linear-gradient(125deg,#f7dcae,#d9ab70); }.face { position:absolute; top:17px; left:18px; width:108px; height:76px; border:5px solid #5d4430; border-radius:37px; background:radial-gradient(circle at 50% 95%,#402f29,#1f2229 55%); box-shadow:inset 0 0 20px #0009; }.eye { position:absolute; top:20px; width:25px; height:25px; border-radius:50%; background:#45e1fa; box-shadow:0 0 16px #39dcf8; }.eye.left { left:20px; }.eye.right { right:20px; }.mouth { position:absolute; left:43px; bottom:10px; width:17px; height:5px; border-radius:5px; background:#45e1fa; transform-origin:center; }.ear { position:absolute; top:39px; width:15px; height:38px; border:3px solid #5d4430; border-radius:8px; background:#43dff6; }.ear.left { left:-17px; }.ear.right { right:-17px; }

    .robot.listening { animation:listening .75s ease-in-out infinite alternate; filter:drop-shadow(0 28px 28px #0008) drop-shadow(0 0 36px #ff866d88); }.robot.thinking { animation:thinking 1s ease-in-out infinite alternate; }.robot.speaking { animation:speaking .4s ease-in-out infinite alternate; filter:drop-shadow(0 28px 28px #0008) drop-shadow(0 0 40px #4ee7ff8a); }.robot.happy { filter:drop-shadow(0 28px 28px #0008) drop-shadow(0 0 42px #65f7d7a3); }.robot.curious { filter:drop-shadow(0 28px 28px #0008) drop-shadow(0 0 38px #c8a4ff8a); }
    .gesture-hand { position:absolute; z-index:3; top:48%; width:54px; height:116px; border:4px solid #172035; border-radius:48% 48% 42% 42%; background:linear-gradient(130deg,#eef2fa,#b9c3d8); box-shadow:inset 8px 7px 13px #fff9,0 0 25px #4de9ff38; transform-origin:50% 12%; opacity:0; transition:opacity .28s ease; } .gesture-hand.left { left:11%; transform:rotate(12deg); } .gesture-hand.right { right:11%; transform:rotate(-12deg); } .face-overlay { position:absolute; z-index:4; width:min(440px,82vw); aspect-ratio:1/1; pointer-events:none; opacity:0; transition:opacity .25s ease; } .expression-eye { position:absolute; top:30%; width:8%; height:4%; border-radius:50% 50% 44% 44%; background:#59eafa; box-shadow:0 0 20px #4ceeff; } .expression-eye.left { left:35.5%; } .expression-eye.right { right:35.5%; } .robo-mouth { position:absolute; top:36.6%; left:47%; width:6%; height:1.7%; border-radius:0 0 50% 50%; background:#59eafa; box-shadow:0 0 14px #4ceeff; transform-origin:center; } .robot-button[data-state~="speaking"] .face-overlay,.robot-button[data-state~="speaking"] .gesture-hand,.robot-button[data-state~="listening"] .face-overlay { opacity:1; } .robot-button[data-state~="speaking"] .robo-mouth { animation:lips .16s ease-in-out infinite alternate; } .robot-button[data-state~="speaking"] .gesture-hand.right { animation:handWave .55s ease-in-out infinite alternate; } .robot-button[data-state~="speaking"] .gesture-hand.left { animation:handTalk .7s ease-in-out infinite alternate; } .robot-button[data-state~="listening"] .expression-eye { animation:eyeGlow .65s ease-in-out infinite alternate; } .robot-button[data-state~="happy"] .face-overlay { opacity:1; } .robot-button[data-state~="happy"] .expression-eye { height:2%; top:31%; border-radius:50% 50% 0 0; } .robot-button[data-state~="curious"] .face-overlay { opacity:1; } .robot-button[data-state~="curious"] .expression-eye.left { transform:translateY(-8px) rotate(-12deg); } .subtitle { width:100%; min-height:190px; max-height:76vh; overflow-y:auto; display:grid; place-items:center; padding:clamp(26px,4vw,54px); border:1px solid #b5f5ff38; border-radius:32px; background:linear-gradient(135deg,#ffffff16,#a17bff16); box-shadow:0 25px 90px #0005,inset 0 1px #ffffff33; backdrop-filter:blur(16px); color:#f4fbff; text-align:left; font-size:clamp(20px,2.35vw,30px); font-weight:600; line-height:1.34; text-shadow:0 2px 20px #000; transition:font-size .2s ease; } .subtitle.is-long { font-size:clamp(16px,1.8vw,23px); line-height:1.3; } .subtitle.is-very-long { font-size:clamp(12px,1.28vw,18px); line-height:1.25; }
    #camera,#snapshot { position:fixed; width:1px; height:1px; opacity:0; pointer-events:none; }
    @keyframes float { 50% { transform:translateY(-10px) scale(1.025); } } @keyframes lips { to { transform:scaleX(1.45) scaleY(3.1); border-radius:45%; } } @keyframes handWave { to { transform:rotate(-42deg) translateY(-8px); } } @keyframes handTalk { to { transform:rotate(30deg) translateY(-4px); } } @keyframes eyeGlow { to { opacity:1; transform:scaleY(.7); } } @keyframes pulse { 50% { transform:scale(1.1); opacity:.65; } } @keyframes aurora { to { transform:rotate(360deg); } } @keyframes listening { to { transform:scale(1.035); } } @keyframes thinking { to { transform:rotate(7deg); } } @keyframes speaking { to { transform:translateY(-5px) rotate(1deg); } } @keyframes wave { to { transform:rotate(-46deg); } } @keyframes mouth { to { transform:scaleX(1.7) scaleY(.4); } } @keyframes blink { 48%,52% { transform:scaleY(.15); } }
    @media (max-width:760px) { body { overflow:auto; } .stage { grid-template-columns:1fr; grid-template-rows:auto auto; gap:12px; padding:30px 20px; } .robot-button { width:min(440px,90vw); } .robot { transform:scale(1.04); } .subtitle { min-height:120px; text-align:center; font-size:clamp(18px,5vw,25px); } } @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; } }
  </style>

<body>
  <button id="stopVedButton" class="stop-ved" type="button" hidden>Stop Ved</button>
  <main class="stage">
    <button id="robotButton" class="robot-button" type="button" aria-label="Start talking with Ved Robo">
      <img id="robot" class="robot robot-fallback" src="{{ url_for('static', filename='ved-robo-transparent.png') }}" alt="Ved Robo" draggable="false">
    </button>
    <p id="subtitle" class="subtitle" role="status" aria-live="polite">Tap Ved to begin. Camera recognition stays only in this browser.</p>
  </main>
  <video id="camera" autoplay muted playsinline></video><canvas id="snapshot"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script>
    const robot=document.querySelector('#robot'), robotButton=document.querySelector('#robotButton'), stopVedButton=document.querySelector('#stopVedButton'), subtitle=document.querySelector('#subtitle'), camera=document.querySelector('#camera'), snapshot=document.querySelector('#snapshot');
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition, profileKey='ved_robo_face_profiles_v1';
    let recognition, listening=false, started=false, faceModelsReady=false, enrollment=null, latestFace=null, history=[], activeProfileId='', sessionReady=false, faceMissingSince=0, presencePrompted=false, detecting=false, speaking=false, processingSpeech=false, silenceCount=0, restartTimer=0, objectModel=null, currentAudio=null, currentAudioDone=null, audioContext=null, microphoneStream=null, interruptionTimer=0, interruptionStarted=0, interrupting=false, assemblyRecording=false, browserSpeechDone=null, liveSocket=null, liveReady=false, liveAudioContext=null, liveMicSource=null, liveMicProcessor=null, liveAudioNextAt=0, liveAudioSources=new Set(), liveOutputText='';
    const profiles=JSON.parse(localStorage.getItem(profileKey)||'[]');
    function setState(next,text){const value=String(text||'');robot.className='robot robot-fallback '+next;robotButton.dataset.state=next;stopVedButton.hidden=!next.includes('speaking');subtitle.textContent=value;subtitle.classList.toggle('is-long',value.length>180&&value.length<=420);subtitle.classList.toggle('is-very-long',value.length>420);}
    function cleanSpeechText(text){return String(text||'').replace(/\*\*|__|`|#+/g,'').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/[•]/g,'. ').replace(/\s+/g,' ').trim();}
    function expression(text){const value=String(text).toLowerCase();if(/[?]/.test(value))return'curious';if(/welcome|glad|happy|great|wonderful|good to see/.test(value))return'happy';return'';}
    function clearRestart(){if(restartTimer){window.clearTimeout(restartTimer);restartTimer=0;}}
    function resumeListening(delay=300){if(!started||processingSpeech||assemblyRecording)return;clearRestart();restartTimer=window.setTimeout(()=>{restartTimer=0;if(processingSpeech||assemblyRecording)return;if(enrollment){assemblyFallback();return;}startGeminiLive();},delay);}
    function pauseListening(){clearRestart();if(listening&&recognition){try{recognition.abort();}catch{}}}
    function listeningPrompt(){if(enrollment==='name')return 'Please tell me your name.';return 'Listening for your question.';}
    function finishSpeaking(){if(interrupting)return;speaking=false;currentAudio=null;setState('',listeningPrompt());resumeListening();}
    function speechLocaleFor(text){const value=String(text||'');if(/[\u0900-\u097f]/u.test(value))return'hi-IN';if(/[\u0980-\u09ff]/u.test(value))return'bn-IN';if(/[\u0a80-\u0aff]/u.test(value))return'gu-IN';if(/[\u0a00-\u0a7f]/u.test(value))return'pa-IN';if(/[\u0b80-\u0bff]/u.test(value))return'ta-IN';if(/[\u0c00-\u0c7f]/u.test(value))return'te-IN';if(/[\u0c80-\u0cff]/u.test(value))return'kn-IN';if(/[\u0d00-\u0d7f]/u.test(value))return'ml-IN';if(/[\u0600-\u06ff]/u.test(value))return'ur-PK';if(/[\u4e00-\u9fff]/u.test(value))return'zh-CN';if(/[\u3040-\u30ff]/u.test(value))return'ja-JP';if(/[\uac00-\ud7af]/u.test(value))return'ko-KR';if(/[\u0400-\u04ff]/u.test(value))return'ru-RU';return navigator.language||'en-US';}
    function browserSpeak(text){return new Promise(resolve=>{if(!window.speechSynthesis){finishSpeaking();resolve();return;}const speech=new SpeechSynthesisUtterance(cleanSpeechText(text));speech.lang=speechLocaleFor(text);speech.rate=1.12;let settled=false;const done=()=>{if(settled)return;settled=true;browserSpeechDone=null;finishSpeaking();resolve();};browserSpeechDone=done;speech.onstart=()=>setState('speaking '+expression(text),text);speech.onend=done;speech.onerror=done;window.speechSynthesis.cancel();window.speechSynthesis.speak(speech);});}
    async function speak(text){const clean=cleanSpeechText(text);speaking=true;pauseListening();setState('speaking '+expression(clean),clean);try{const response=await fetch('/api/robo-speech',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:clean,language:speechLocaleFor(clean)})});if(!response.ok)throw new Error();const url=URL.createObjectURL(await response.blob()),audio=new Audio(url);currentAudio=audio;audio.playbackRate=1.12;await new Promise(resolve=>{let settled=false;const finish=()=>{if(settled)return;settled=true;currentAudioDone=null;URL.revokeObjectURL(url);finishSpeaking();resolve();};const fallback=()=>{if(settled)return;settled=true;currentAudioDone=null;URL.revokeObjectURL(url);currentAudio=null;browserSpeak(clean).then(resolve);};currentAudioDone=finish;audio.onplay=()=>setState('speaking '+expression(clean),clean);audio.onended=finish;audio.onerror=fallback;audio.play().catch(fallback);});}catch{await browserSpeak(clean);}}
    function liveBase64ToBytes(value){const raw=atob(value||'');const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i+=1)bytes[i]=raw.charCodeAt(i);return bytes;}
    function liveBytesToBase64(bytes){let raw='';const part=0x8000;for(let i=0;i<bytes.length;i+=part)raw+=String.fromCharCode(...bytes.subarray(i,i+part));return btoa(raw);}
    function floatToPcm16(samples,fromRate,targetRate=16000){const size=Math.max(1,Math.round(samples.length*targetRate/fromRate));const out=new Int16Array(size);for(let i=0;i<size;i+=1){const position=i*fromRate/targetRate;const left=Math.floor(position),right=Math.min(left+1,samples.length-1),mix=position-left;const value=samples[left]*(1-mix)+samples[right]*mix;out[i]=Math.max(-1,Math.min(1,value))*0x7fff;}return new Uint8Array(out.buffer);}
    function stopLivePlayback(){for(const source of liveAudioSources){try{source.stop();}catch{}}liveAudioSources.clear();liveAudioNextAt=0;}
    function playLiveAudio(data){if(!data||!liveAudioContext)return;const bytes=liveBase64ToBytes(data);const input=new Int16Array(bytes.buffer,bytes.byteOffset,Math.floor(bytes.byteLength/2));const audio=liveAudioContext.createBuffer(1,input.length,24000);const channel=audio.getChannelData(0);for(let i=0;i<input.length;i+=1)channel[i]=input[i]/0x8000;const source=liveAudioContext.createBufferSource();source.buffer=audio;source.connect(liveAudioContext.destination);const start=Math.max(liveAudioNextAt,liveAudioContext.currentTime+.04);source.start(start);liveAudioNextAt=start+audio.duration;liveAudioSources.add(source);source.onended=()=>liveAudioSources.delete(source);}
    function stopGeminiLive(){stopLivePlayback();if(liveMicProcessor){try{liveMicProcessor.disconnect();}catch{}liveMicProcessor=null;}if(liveMicSource){try{liveMicSource.disconnect();}catch{}liveMicSource=null;}if(liveSocket){try{liveSocket.close(1000,'session ended');}catch{}}liveSocket=null;liveReady=false;}
    async function handleLiveToolCall(toolCall){for(const call of toolCall.functionCalls||[]){let result={context:'This school lookup is unavailable.'};if(call.name==='lookup_school_information'){try{const response=await fetch('/api/robo-school-context',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:call.args?.question||''})});result=await response.json();}catch{result={context:'Official school information could not be loaded right now.'};}}if(liveSocket?.readyState===WebSocket.OPEN)liveSocket.send(JSON.stringify({toolResponse:{functionResponses:[{id:call.id,name:call.name,response:{result}}]}}));}}
    function startLiveMicrophone(){if(!liveAudioContext||liveMicProcessor||!microphoneStream)return;liveMicSource=liveAudioContext.createMediaStreamSource(microphoneStream);liveMicProcessor=liveAudioContext.createScriptProcessor(2048,1,1);liveMicProcessor.onaudioprocess=event=>{const output=event.outputBuffer.getChannelData(0);output.fill(0);if(!liveReady||liveSocket?.readyState!==WebSocket.OPEN)return;const pcm=floatToPcm16(event.inputBuffer.getChannelData(0),liveAudioContext.sampleRate);liveSocket.send(JSON.stringify({realtimeInput:{audio:{data:liveBytesToBase64(pcm),mimeType:'audio/pcm;rate=16000'}}}));};liveMicSource.connect(liveMicProcessor);liveMicProcessor.connect(liveAudioContext.destination);}
    async function startGeminiLive(){if(liveReady||liveSocket?.readyState===WebSocket.CONNECTING)return true;if(!microphoneStream)return false;try{setState('thinking','Connecting to Ved Live...');const tokenResponse=await fetch('/api/robo-live-token',{method:'POST'});const tokenData=await tokenResponse.json();if(!tokenResponse.ok||!tokenData.token)throw new Error(tokenData.error||'Gemini Live is unavailable.');liveAudioContext=liveAudioContext||new AudioContext();await liveAudioContext.resume();const endpoint='wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained?access_token='+encodeURIComponent(tokenData.token);liveSocket=new WebSocket(endpoint);liveSocket.onopen=()=>{const setup={setup:{model:'models/'+tokenData.model,responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:tokenData.voice||'Aoede'}}},inputAudioTranscription:{languageCodes:[]},outputAudioTranscription:{},systemInstruction:{parts:[{text:'You are Ved Robo, the helpful reception assistant for Salwan Public School, Trans Delhi Signature City. Respond naturally in the visitor language, keep replies under three short sentences, and use the official-school lookup tool for school-specific details. Do not invent facts. You may be interrupted politely.'}]},tools:[{functionDeclarations:[{name:'lookup_school_information',description:'Look up public official Salwan Public School information for admissions, fees, contact, calendar, policies, facilities, academics, activities, or any school-specific request.',parameters:{type:'OBJECT',properties:{question:{type:'STRING'}},required:['question']}}]}]}};liveSocket.send(JSON.stringify(setup));};liveSocket.onmessage=event=>{const message=JSON.parse(event.data);if(message.setupComplete){liveReady=true;startLiveMicrophone();setState('listening','Listening. Please speak now.');return;}if(message.toolCall){handleLiveToolCall(message.toolCall);return;}const content=message.serverContent;if(!content)return;if(content.interrupted){stopLivePlayback();speaking=false;setState('listening','I am listening. Please continue.');}if(content.interimInputTranscription?.text)setState('listening',content.interimInputTranscription.text);if(content.inputTranscription?.text)setState('thinking','Ved is thinking...');if(content.outputTranscription?.text){liveOutputText=content.outputTranscription.text;speaking=true;setState('speaking '+expression(liveOutputText),liveOutputText);}for(const part of content.modelTurn?.parts||[]){if(part.inlineData?.data){speaking=true;setState('speaking '+expression(liveOutputText),liveOutputText||'Ved is speaking...');playLiveAudio(part.inlineData.data);}}if(content.turnComplete){window.setTimeout(()=>{if(!liveAudioSources.size){speaking=false;setState('listening','Listening. Please speak now.');}},350);}};liveSocket.onerror=()=>{};liveSocket.onclose=()=>{const wasReady=liveReady;liveReady=false;liveSocket=null;if(wasReady&&!speaking)setState('curious','Ved Live disconnected. Tap Ved to reconnect.');};return true;}catch(error){setState('curious',error.message||'Ved Live is unavailable. Tap Ved to use backup voice.');return false;}}
    function stopVedSpeaking(){clearRestart();stopGeminiLive();if(currentAudio){currentAudio.pause();currentAudio=null;}if(window.speechSynthesis)window.speechSynthesis.cancel();const done=currentAudioDone||browserSpeechDone;if(done){done();return;}speaking=false;setState('listening','Ved stopped speaking. Please continue.');}
    async function handleInterruption(){if(interrupting||!speaking)return;interrupting=true;clearRestart();if(currentAudio){currentAudio.pause();currentAudio=null;}if(currentAudioDone)currentAudioDone();if(window.speechSynthesis)window.speechSynthesis.cancel();speaking=false;setState('curious','Do you want to add something more to the question?');await new Promise(resolve=>setTimeout(resolve,120));interrupting=false;await speak('Do you want to add something more to the question?');}
    function setupInterruptionMonitor(){if(!microphoneStream||!window.AudioContext)return;try{audioContext=new AudioContext();const source=audioContext.createMediaStreamSource(microphoneStream),analyser=audioContext.createAnalyser(),samples=new Uint8Array(512);analyser.fftSize=1024;source.connect(analyser);window.setInterval(()=>{if(!speaking||interrupting||liveReady){interruptionStarted=0;return;}analyser.getByteTimeDomainData(samples);let energy=0;for(const sample of samples){const value=(sample-128)/128;energy+=value*value;}const level=Math.sqrt(energy/samples.length);if(level>.055){interruptionStarted||=Date.now();if(Date.now()-interruptionStarted>650)handleInterruption();}else interruptionStarted=0;},150);}catch{ /* interruption detection is optional */ }}
    function distance(a,b){return Math.sqrt(a.reduce((sum,value,index)=>sum+(value-b[index])**2,0));}
    function captureImage(){const size=220;snapshot.width=size;snapshot.height=size;const ctx=snapshot.getContext('2d');const side=Math.min(camera.videoWidth,camera.videoHeight);ctx.drawImage(camera,(camera.videoWidth-side)/2,(camera.videoHeight-side)/2,side,side,0,0,size,size);return snapshot.toDataURL('image/jpeg',.72);}
    async function detectFace(){if(detecting||!faceModelsReady||camera.readyState<2||speaking||processingSpeech)return;detecting=true;try{const result=await faceapi.detectSingleFace(camera,new faceapi.TinyFaceDetectorOptions({inputSize:160,scoreThreshold:.5})).withFaceLandmarks().withFaceDescriptor();if(!result){if(sessionReady&&!enrollment){faceMissingSince||=Date.now();if(!presencePrompted&&Date.now()-faceMissingSince>30000){presencePrompted=true;await speak('Is someone there? I cannot see a familiar face.');}}return;}latestFace={descriptor:Array.from(result.descriptor),image:captureImage()};faceMissingSince=0;presencePrompted=false;if(sessionReady)return;const match=profiles.map(profile=>({profile,score:distance(latestFace.descriptor,profile.descriptor)})).sort((a,b)=>a.score-b.score)[0];sessionReady=true;if(match&&match.score<.48){activeProfileId=match.profile.id;await speak(`Welcome back, ${match.profile.name}. What would you like to ask?`);return;}enrollment='name';await speak('I have not met you before. Your profile will stay only in this browser. Please tell me your name by saying: my name is.');}catch{ /* camera continues without recognition */ }finally{detecting=false;}}
    function saveProfile(name){if(!latestFace)return false;const profile={id:crypto.randomUUID(),name,descriptor:latestFace.descriptor,image:latestFace.image,createdAt:new Date().toISOString()};profiles.push(profile);localStorage.setItem(profileKey,JSON.stringify(profiles));activeProfileId=profile.id;sessionReady=true;return true;}
    function nameFrom(text){const value=String(text).trim();const match=value.match(/(?:my name is|i am|i'm|this is|मेरा नाम(?: है)?|मैं हूँ)\s+([\p{L}][\p{L}\s'-]{0,38})/iu);return (match?match[1]:value).trim().replace(/(?:\s+है|[.?!,]+)$/u,'').trim();}
    function asksAboutVisibleObject(question){return /(?:what(?:'s| is)? this|what am i holding|what.{0,50}(?:object|thing|item|holding|hold|hand|camera|see)|identify.{0,50}(?:object|thing|item|hand|camera)|can you see.{0,50}(?:object|thing|item|hand|camera))/i.test(String(question||''));}
    function captureVisionImage(){const maxSide=900;const scale=Math.min(1,maxSide/Math.max(camera.videoWidth,camera.videoHeight));snapshot.width=Math.max(1,Math.round(camera.videoWidth*scale));snapshot.height=Math.max(1,Math.round(camera.videoHeight*scale));snapshot.getContext('2d').drawImage(camera,0,0,snapshot.width,snapshot.height);return snapshot.toDataURL('image/jpeg',.86).split(',')[1];}
    async function describeVisibleObject(){if(camera.readyState<2){await speak('I cannot see the camera yet. Please wait a moment and try again.');return;}setState('thinking','Looking closely at the object in your hand...');try{const response=await fetch('/api/robo-vision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:captureVisionImage()})});const data=await response.json();if(!response.ok||!data.answer)throw new Error(data.error||'I could not inspect the image.');await speak(data.answer);}catch(error){await speak(error.message||'I could not inspect the camera image right now. Please try again.');}}
    async function answerQuestion(question){if(asksAboutVisibleObject(question)){await describeVisibleObject();return;}setState('thinking','Ved is thinking...');try{history.push({role:'user',content:question});const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:question,history:history.slice(-10),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',schoolContext:true,roboMode:true})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Ved could not answer right now.');history.push({role:'assistant',content:data.reply});await speak(data.reply);}catch(error){await speak(error.message||'I could not answer that right now.');}}
    async function handleSpeech(text){const spoken=String(text||'').trim();if(!spoken)return;if(enrollment==='consent'){const agrees=/\b(yes|yeah|yep|i agree|agree|okay|ok|sure|haan|ha)\b/i.test(spoken)||/(हाँ|हां|जी हाँ|जी हां|हाँ जी|हां जी)/u.test(spoken);const refuses=/\b(no|nope|nah|do not|don't|decline)\b/i.test(spoken)||/(नहीं|नही|ना|मत)/u.test(spoken);if(agrees){enrollment='name';await speak('Thank you. Please tell me your name by saying: my name is.');}else if(refuses){declinedUntil=Date.now()+60000;enrollment=null;await speak('No profile will be saved. You can still ask me questions.');}else await speak('I need a clear yes or no before saving a profile. Please say yes to continue, or no to skip it.');return;}if(enrollment==='name'){const name=nameFrom(spoken);if(saveProfile(name)){enrollment=null;await speak(`Nice to meet you, ${name}. I saved your face profile only in this browser. What would you like to ask?`);}else await speak('Please look at the camera for a moment, then tell me your name again.');return;}await answerQuestion(spoken);}
    async function typedFallback(){const promptText=enrollment==='name'?'I could not hear your name. Type your name, then press OK.':'I could not hear you. Type your question, then press OK.';const typed=window.prompt(promptText);if(!typed||!typed.trim()){setState('curious',listeningPrompt());resumeListening();return;}silenceCount=0;processingSpeech=true;try{await handleSpeech(typed.trim());}finally{processingSpeech=false;resumeListening();}}
    async function assemblyFallback(){if(assemblyRecording||!microphoneStream||!window.MediaRecorder){await typedFallback();return;}assemblyRecording=true;clearRestart();pauseListening();setState('listening','Listening. Please speak now.');const chunks=[];try{const recorder=new MediaRecorder(microphoneStream);recorder.ondataavailable=event=>{if(event.data.size)chunks.push(event.data);};recorder.onerror=()=>{assemblyRecording=false;setState('curious','I could not record your voice. Tap Ved and try again.');};recorder.onstop=async()=>{assemblyRecording=false;const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(!blob.size){setState('curious','I did not hear anything. Tap Ved and try again.');return;}processingSpeech=true;setState('thinking','Understanding your voice...');try{const form=new FormData();form.append('audio',blob,'ved-voice.webm');const response=await fetch('/api/robo-transcribe',{method:'POST',body:form});const data=await response.json();if(!response.ok)throw new Error(data.error||'Voice transcription is unavailable.');if(!data.transcript)throw new Error('I could not understand that.');silenceCount=0;await handleSpeech(data.transcript);}catch(error){setState('curious',error.message||'I could not understand that. Tap Ved and try again.');}finally{processingSpeech=false;resumeListening();}};recorder.start();setTimeout(()=>{if(recorder.state==='recording')recorder.stop();},5000);}catch{assemblyRecording=false;await typedFallback();}}
    function setupRecognition(){if(!SpeechRecognition){setState('curious','Browser voice input is unavailable. Tap Ved to use AssemblyAI voice.');return;}recognition=new SpeechRecognition();recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;recognition.lang=navigator.language||'en-US';recognition.onstart=()=>{listening=true;if(!speaking)setState('listening',listeningPrompt());};recognition.onresult=async event=>{listening=false;silenceCount=0;processingSpeech=true;try{await handleSpeech(event.results[0][0].transcript);}finally{processingSpeech=false;resumeListening();}};recognition.onend=()=>{listening=false;if(!speaking&&!processingSpeech&&silenceCount<2)resumeListening();};recognition.onerror=event=>{listening=false;if(event.error==='aborted')return;if(event.error==='no-speech'){silenceCount+=1;if(silenceCount>=2){setState('curious','I could not hear you. Tap Ved once to use AssemblyAI voice.');return;}if(!speaking)setState('listening',listeningPrompt());resumeListening();return;}if(event.error==='not-allowed'||event.error==='service-not-allowed'){setState('curious','Microphone permission is blocked. Allow microphone access, then tap Ved.');return;}setState('curious','Browser voice input had a problem. Tap Ved once to use AssemblyAI voice.');};}
    async function start(){if(started)return;started=true;setState('thinking','Starting camera and voice...');try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:640}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});camera.srcObject=stream;microphoneStream=new MediaStream(stream.getAudioTracks());await camera.play();setupInterruptionMonitor();try{await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),faceapi.nets.faceLandmark68Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),faceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models')]);}catch{throw new Error('models');}faceModelsReady=true;setState('',profiles.length?'Camera is ready. Looking for a familiar face...':'Camera is ready. Look at Ved so I can meet you.');await detectFace();resumeListening(350);window.setInterval(detectFace,900);}catch(error){setState('',error.message==='models'?'Face recognition could not load. Check your internet connection and tap Ved to retry.':'Camera and microphone permission are needed. Tap Ved and allow both.');started=false;}}
    stopVedButton.addEventListener('click',stopVedSpeaking);
    robotButton.addEventListener('click',async()=>{if(!started){await start();return;}if(speaking){stopVedSpeaking();return;}silenceCount=0;if(enrollment){await assemblyFallback();return;}const connected=await startGeminiLive();if(!connected)await assemblyFallback();});
    window.addEventListener('beforeunload',stopGeminiLive);
  </script>
